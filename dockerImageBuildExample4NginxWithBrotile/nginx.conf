worker_processes  2;
pid /var/log/nginx/nginx.pid;
error_log /var/log/nginx/error.log info;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # use cache-backed temp directories (owned by nginx user)
    client_body_temp_path /var/cache/nginx/client_body_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json text/xml image/svg+xml;
    include /etc/nginx/conf.d/*.conf;
}

